# dsh-gitlab-credentials bundle patch: inserts the plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
#   dsh plugin --profile web add link:./dsh-gitlab-credentials
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (credential store, /api/dsh-gitlab-credentials routes,
# glab sync, agent tool), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client", served at /plugins/<id>/client.js)
# register the settings-page section.
- insert:
    - id: gitlab-credentials
      name: '@linxin666/dsh-gitlab-credentials'
